<div class="container py-4">
  <!-- Encabezado -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h4 text-secondary fw-bold">Historial de Compras</h1>
    <a routerLink="/new" class="btn btn-primary shadow-sm">
      <i class="bi bi-plus-lg"></i> Nueva Compra
    </a>
  </div>

  <!-- Filtros -->
  <div class="card mb-4 shadow-sm">
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <div class="col-md-3">
          <label class="form-label">Desde</label>
          <input type="date" class="form-control" />
        </div>

        <div class="col-md-3">
          <label class="form-label">Hasta</label>
          <input type="date" class="form-control" />
        </div>

        <div class="col-md-4">
          <label class="form-label">Buscar</label>
          <input type="text" class="form-control" placeholder="Buscar por proveedor, factura..." />
        </div>

        <div class="col-md-2 d-flex gap-2">
          <button class="btn btn-success w-100">
            <i class="bi bi-file-earmark-spreadsheet"></i> CSV
          </button>
          <button class="btn btn-danger w-100"><i class="bi bi-file-earmark-pdf"></i> PDF</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Tabla -->
  <div class="card shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Fecha</th>
              <th>Proveedor</th>
              <th>Factura</th>
              <th>Monto</th>
              <th>Estado</th>
              <th class="text-end">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>2025-09-01</td>
              <td>Distribuidora ABC</td>
              <td>FAC-000123</td>
              <td>Q 1,250.00</td>
              <td><span class="badge bg-success">Pagado</span></td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-primary">
                  <i class="bi bi-eye"></i> Ver
                </button>
                <button class="btn btn-sm btn-outline-secondary">
                  <i class="bi bi-printer"></i> Imprimir
                </button>
              </td>
            </tr>
            <tr>
              <td>2025-09-10</td>
              <td>Proveedor XYZ</td>
              <td>FAC-000124</td>
              <td>Q 980.00</td>
              <td><span class="badge bg-warning text-dark">Pendiente</span></td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-primary">
                  <i class="bi bi-eye"></i> Ver
                </button>
                <button class="btn btn-sm btn-outline-secondary">
                  <i class="bi bi-printer"></i> Imprimir
                </button>
              </td>
            </tr>
            <tr>
              <td colspan="6" class="text-center text-muted py-3">No se encontraron registros</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Paginación -->
      <div class="d-flex justify-content-between align-items-center p-3">
        <small class="text-muted"> Mostrando 1 a 3 de 20 registros </small>
        <nav>
          <ul class="pagination pagination-sm mb-0">
            <li class="page-item disabled">
              <a class="page-link">Anterior</a>
            </li>
            <li class="page-item active"><a class="page-link">1</a></li>
            <li class="page-item"><a class="page-link">2</a></li>
            <li class="page-item"><a class="page-link">3</a></li>
            <li class="page-item">
              <a class="page-link">Siguiente</a>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</div>
