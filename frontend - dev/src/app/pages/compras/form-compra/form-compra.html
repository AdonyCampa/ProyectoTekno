<div class="container mt-4">
  <!-- Encabezado -->
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
    <h2 class="mb-2 mb-md-0">Nueva Compra</h2>
    <button class="btn btn-outline-secondary btn-sm">Regresar</button>
  </div>

  <!-- Datos del proveedor -->
  <div class="card shadow-sm mb-4">
    <div class="card-body row g-2 align-items-center">
      <div class="col-md-3">
        <label class="form-label mb-0">Proveedor</label>
        <select class="form-select form-select-sm">
          <option selected>Seleccione un proveedor...</option>
          <option>Proveedor 1</option>
          <option>Proveedor 2</option>
          <option>Proveedor 3</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label mb-0">Contacto</label>
        <input type="text" class="form-control form-control-sm" placeholder="Nombre contacto" />
      </div>
      <div class="col-md-2">
        <label class="form-label mb-0">Teléfono</label>
        <input type="text" class="form-control form-control-sm" placeholder="Teléfono" />
      </div>
      <div class="col-md-4">
        <label class="form-label mb-0">Dirección</label>
        <input type="text" class="form-control form-control-sm" placeholder="Dirección" />
      </div>
    </div>
  </div>

  <!-- Productos -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <!-- Buscador y agregar producto -->
      <div class="row g-2 mb-3 align-items-end">
        <div class="col-12 col-md-5">
          <label class="form-label">Buscar Producto</label>
          <input
            type="text"
            class="form-control form-control-sm"
            placeholder="Ingrese nombre o código"
          />
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label">Stock</label>
          <input type="number" class="form-control form-control-sm" value="0" disabled />
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label">Precio</label>
          <input type="number" class="form-control form-control-sm" value="0.00" disabled />
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label">Cantidad</label>
          <input type="number" class="form-control form-control-sm" value="1" min="1" />
        </div>
        <div class="col-6 col-md-1">
          <button class="btn btn-success btn-sm w-100">Agregar</button>
        </div>
      </div>

      <!-- Tabla de productos agregados -->
      <div class="table-responsive">
        <table class="table table-sm table-bordered align-middle mb-0">
          <thead class="table-secondary">
            <tr>
              <th>Producto</th>
              <th>Stock</th>
              <th>Precio Unitario</th>
              <th>Cantidad</th>
              <th>Subtotal</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Producto 1</td>
              <td>10</td>
              <td>Q 15.00</td>
              <td>2</td>
              <td>Q 30.00</td>
              <td>
                <button type="button" class="btn btn-danger btn-sm">🗑️</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Total y botones dentro de un card -->
  <div class="card shadow-sm">
    <div class="card-body d-flex flex-column flex-md-row align-items-center w-100">
      <!-- Total a la izquierda -->
      <h5 class="mb-3 mb-md-0">Total a Pagar: <span class="text-success">Q 30.00</span></h5>

      <!-- Botones a la derecha -->
      <div class="ms-md-auto d-flex gap-2">
        <button type="button" class="btn btn-secondary">Cancelar</button>
        <button type="button" class="btn btn-primary">Guardar Compra</button>
      </div>
    </div>
  </div>
</div>
