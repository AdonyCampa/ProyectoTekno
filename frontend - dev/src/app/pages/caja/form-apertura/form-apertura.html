<div class="modal-dialog modal-md">
  <div class="modal-content">
    <div class="modal-header bg-primary text-white">
      <h5 class="modal-title">Apertura de Caja</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
    </div>
    <form [formGroup]="cajaForm" (ngSubmit)="save()">
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Saldo Inicial</label>
          <input
            id="monto_inicial"
            type="number"
            class="form-control"
            placeholder="Ingrese el saldo inicial"
            formControlName="monto_inicial"
            [ngClass]="{
              'is-invalid':
                cajaForm.get('monto_inicial')?.touched && cajaForm.get('monto_inicial')?.invalid
            }"
          />
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary" data-bs-dismiss="modal">Abrir Caja</button>
      </div>
    </form>
  </div>
</div>
