<!--begin::App Content Header-->
<div class="app-content-header">
  <!--begin::Container-->
  <div class="container-fluid">
    <!--begin::Row-->
    <div class="row">
      <div class="col-sm-6">
        <h3 class="mb-0">Roles</h3>
      </div>
      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-end">
          <li class="breadcrumb-item"><a>Autenticación</a></li>
          <li class="breadcrumb-item active" aria-current="page">Roles</li>
        </ol>
      </div>
    </div>
    <!--end::Row-->
  </div>
  <!--end::Container-->
</div>
<!--end::App Content Header-->

<div class="app-content">
  <div class="container-fluid">
    <div class="row">
      <div class="col">
        <div class="d-flex justify-content-between mb-3">
          <button
            class="btn btn-info ms-2"
            data-bs-toggle="modal"
            data-bs-target="#rolFormModal"
            (click)="openForm(null, 'crear')"
          >
            Agregar Rol
          </button>
          <input
            type="text"
            class="form-control w-50"
            placeholder="Buscar rol..."
            [(ngModel)]="search"
          />
        </div>

        <table class="table table-striped table-bordered table-hover">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Rol</th>
              <th>Descripción</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            @for (rol of filteredRoles; track $index) {

            <tr>
              <td>{{ rol.id }}</td>
              <td>{{ rol.rol }}</td>
              <td>{{ rol.descripcion }}</td>
              <td>
                <div class="btn-group btn-group-sm">
                  <a
                    class="btn btn-info"
                    data-bs-toggle="modal"
                    data-bs-target="#rolFormModal"
                    (click)="openForm(rol, 'ver')"
                    ><i class="bi bi-eye-fill"></i
                  ></a>
                  <a
                    class="btn btn-warning"
                    data-bs-toggle="modal"
                    data-bs-target="#rolFormModal"
                    (click)="openForm(rol, 'editar')"
                    ><i class="bi i bi-pencil-square"></i
                  ></a>
                  <a class="btn btn-danger" (click)="deleteRol(rol)"
                    ><i class="bi bi-trash-fill"></i
                  ></a>
                </div>
              </td>
            </tr>
            }
          </tbody>
        </table>

        <!-- Paginación simple -->
        <div class="d-flex justify-content-between align-items-center">
          <button class="btn btn-secondary" (click)="changePage(-1)" [disabled]="page === 1">
            Anterior
          </button>
          <span>Página {{ page }} de {{ totalPages() }}</span>
          <button
            class="btn btn-secondary"
            (click)="changePage(1)"
            [disabled]="page === totalPages()"
          >
            Siguiente
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="rolFormModal" tabindex="-1" aria-labelledby="exampleModalLabel">
  <app-form-rol [rol]="rolSeleccionado" [modo]="modoFormulario"></app-form-rol>
</div>
