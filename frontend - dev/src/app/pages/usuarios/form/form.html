<div class="modal-dialog">
  <div class="modal-content">
    <div class="modal-header">
      <h1 class="modal-title fs-5" id="exampleModalLabel">Agregar Usuario</h1>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <form>
      <div class="modal-body">
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label">Nombres</label>
          <input type="nombres" class="form-control" id="nombres" />
        </div>
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label">Apellidos</label>
          <input type="apellidos" class="form-control" id="apellidos" />
        </div>
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label">Usuarios</label>
          <input type="usuario" class="form-control" id="usuario" />
        </div>
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label">DPI</label>
          <input type="dpi" class="form-control" id="dpi" />
        </div>
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label">Estado</label>
          <input type="estado" class="form-control" id="estado" />
        </div>
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label">Rol</label>
          <input type="rol" class="form-control" id="rol" aria-describedby="emailHelp" />
        </div>
        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" />
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>
