<div class="modal-dialog modal-dialog-centered">
  <div class="modal-content">
    <div class="modal-header">
      <h1 class="modal-title fs-5" id="exampleModalLabel">
        {{
          modo === 'crear'
            ? 'Agregar marca'
            : modo === 'editar'
            ? 'Editar marca'
            : 'Detalles de marca'
        }}
      </h1>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <form [formGroup]="marcaForm" (ngSubmit)="save()">
      <div class="modal-body">
        <div class="mb-3">
          <label for="rol" class="form-label">Marca</label>
          <input
            type="text"
            class="form-control"
            id="marca"
            formControlName="marca"
            [ngClass]="{
              'is-invalid': marcaForm.get('marca')?.touched && marcaForm.get('marca')?.invalid
            }"
          />
        </div>

        <div class="col-md-6">
          <label for="estado" class="form-label">Estado</label>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="estado" formControlName="estado" />
            <label class="form-check-label" for="estado">
              {{ marcaForm.get('estado')?.value ? 'Activo' : 'Inactivo' }}
            </label>
          </div>
        </div>
        <div class="mb-3">
          <label for="descripcion" class="form-label">Descripcion</label>
          <textarea
            class="form-control"
            id="descripcion"
            style="height: 100px"
            formControlName="descripcion"
          ></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        @if (modo === 'crear' || modo == 'editar') {
        <button type="submit" class="btn btn-primary" data-bs-dismiss="modal">
          {{ modo === 'crear' ? 'Guardar' : 'Editar' }}
        </button>
        }
      </div>
    </form>
  </div>
</div>
