<!-- Modal -->
<div class="modal-dialog modal-dialog-centered">
  <div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title" id="proveedorFormModalLabel">
        {{
          modo === 'crear'
            ? 'Agregar proveedor'
            : modo === 'editar'
            ? 'Editar proveedor'
            : 'Detalles de proveedor'
        }}
      </h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
    </div>

    <div class="modal-body">
      <form [formGroup]="proveedorForm" (ngSubmit)="save()">
        <!-- Empresa -->
        <div class="mb-3">
          <label for="empresa" class="form-label">Empresa</label>
          <input
            type="text"
            class="form-control"
            id="empresa"
            formControlName="empresa"
            [ngClass]="{
              'is-invalid':
                proveedorForm.get('empresa')?.touched && proveedorForm.get('empresa')?.invalid
            }"
            placeholder="Nombre de la empresa"
          />
        </div>

        <!-- Contacto -->
        <div class="mb-3">
          <label for="contacto" class="form-label">Contacto</label>
          <input
            type="text"
            class="form-control"
            id="contacto"
            formControlName="contacto"
            [ngClass]="{
              'is-invalid':
                proveedorForm.get('contacto')?.touched && proveedorForm.get('contacto')?.invalid
            }"
            placeholder="Nombre del contacto"
          />
        </div>

        <!-- Teléfono -->
        <div class="mb-3">
          <label for="telefono" class="form-label">Teléfono</label>
          <input
            type="tel"
            class="form-control"
            id="telefono"
            formControlName="telefono"
            [ngClass]="{
              'is-invalid':
                proveedorForm.get('telefono')?.touched && proveedorForm.get('telefono')?.invalid
            }"
            placeholder="Ej: 5555-5555"
          />
        </div>

        <!-- Correo -->
        <div class="mb-3">
          <label for="correo" class="form-label">Correo</label>
          <input
            type="email"
            class="form-control"
            id="correo"
            formControlName="correo"
            [ngClass]="{
              'is-invalid':
                proveedorForm.get('correo')?.touched && proveedorForm.get('correo')?.invalid
            }"
            placeholder="ejemplo@correo.com"
          />
        </div>

        <!-- Dirección -->
        <div class="mb-3">
          <label for="direccion" class="form-label">Dirección</label>
          <input
            type="text"
            class="form-control"
            id="direccion"
            formControlName="direccion"
            placeholder="Dirección completa"
          />
        </div>

        <!-- Estado -->
        <div class="mb-3">
          <label for="estado" class="form-label">Estado</label>
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="estado" formControlName="estado" />
            <label class="form-check-label" for="estado">
              {{ proveedorForm.get('estado')?.value ? 'Activo' : 'Inactivo' }}
            </label>
          </div>
        </div>
      </form>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      <button
        type="submit"
        class="btn btn-primary"
        data-bs-dismiss="modal"
        [disabled]="proveedorForm.invalid"
        (click)="save()"
      >
        {{ modo === 'crear' ? 'Guardar' : 'Editar' }}
      </button>
    </div>
  </div>
</div>
