<!-- Modal -->
<div class="modal-dialog modal-dialog-centered">
  <div class="modal-content">
    <!-- Header -->
    <div class="modal-header">
      <h5 class="modal-title" id="clienteFormModalLabel">
        {{
          modo === 'crear'
            ? 'Agregar cliente'
            : modo === 'editar'
            ? 'Editar cliente'
            : 'Detalles de cliente'
        }}
      </h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <form [formGroup]="clienteForm" (ngSubmit)="save()">
        <div class="row g-3">
          <!-- Nombres -->
          <div class="col-md-6">
            <label for="nombres" class="form-label">Nombres</label>
            <input
              type="text"
              id="nombres"
              class="form-control"
              formControlName="nombres"
              [ngClass]="{
                'is-invalid':
                  clienteForm.get('nombres')?.touched && clienteForm.get('nombres')?.invalid
              }"
              placeholder="Ej: Juan Carlos"
            />
          </div>

          <!-- Apellidos -->
          <div class="col-md-6">
            <label for="apellidos" class="form-label">Apellidos</label>
            <input
              type="text"
              id="apellidos"
              class="form-control"
              formControlName="apellidos"
              [ngClass]="{
                'is-invalid':
                  clienteForm.get('apellidos')?.touched && clienteForm.get('apellidos')?.invalid
              }"
              placeholder="Ej: Pérez Gómez"
            />
          </div>

          <!-- DPI -->
          <div class="col-md-6">
            <label for="dpi" class="form-label">DPI</label>
            <input
              type="text"
              id="dpi"
              class="form-control"
              formControlName="dpi"
              [ngClass]="{
                'is-invalid': clienteForm.get('dpi')?.touched && clienteForm.get('dpi')?.invalid
              }"
              placeholder="Número de DPI"
            />
          </div>

          <!-- NIT -->
          <div class="col-md-6">
            <label for="nit" class="form-label">NIT</label>
            <input
              type="text"
              id="nit"
              class="form-control"
              formControlName="nit"
              placeholder="Número de NIT"
            />
          </div>

          <!-- Teléfono -->
          <div class="col-md-6">
            <label for="telefono" class="form-label">Teléfono</label>
            <input
              type="tel"
              id="telefono"
              class="form-control"
              formControlName="telefono"
              placeholder="Ej: 5555-5555"
            />
          </div>

          <!-- Correo -->
          <div class="col-md-6">
            <label for="correo" class="form-label">Correo</label>
            <input
              type="email"
              id="correo"
              class="form-control"
              formControlName="correo"
              placeholder="ejemplo@correo.com"
            />
          </div>

          <!-- Dirección -->
          <div class="col-12">
            <label for="direccion" class="form-label">Dirección</label>
            <input
              type="text"
              id="direccion"
              class="form-control"
              formControlName="direccion"
              placeholder="Dirección completa"
            />
          </div>

          <!-- Estado -->
          <div class="col-md-4">
            <label for="estado" class="form-label">Estado</label>
            <div class="form-check form-switch">
              <input
                type="checkbox"
                id="estado"
                class="form-check-input"
                formControlName="estado"
              />
              <label class="form-check-label" for="estado">
                {{ clienteForm.get('estado')?.value ? 'Activo' : 'Inactivo' }}
              </label>
            </div>
          </div>
        </div>
      </form>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      <button
        type="submit"
        class="btn btn-success"
        [disabled]="clienteForm.invalid"
        data-bs-dismiss="modal"
        (click)="save()"
      >
        {{ modo === 'crear' ? 'Guardar' : 'Editar' }}
      </button>
    </div>
  </div>
</div>
