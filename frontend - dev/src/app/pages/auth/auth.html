    <!----------------------- Main Container -------------------------->

     <div class="container d-flex justify-content-center align-items-center min-vh-100">

    <!----------------------- Login Container -------------------------->

       <div class="row border rounded-5 p-3 bg-white shadow box-area">

    <!--------------------------- Left Box ----------------------------->

       <div class="col-md-6 rounded-4 d-flex justify-content-center align-items-center flex-column left-box" style="background: #103cbe;">
           <div class="featured-image mb-3">
            <img src="/assets/images/2.png" class="img-fluid" style="width: 250px;">
           </div>
           <p class="text-white fs-2" style="font-family: 'Courier New', Courier, monospace; font-weight: 600;">Iniciar Sesión</p>
           <small class="text-white text-wrap text-center" style="width: 17rem;font-family: 'Courier New', Courier, monospace;">Para poder iniciar sesión verificate</small>
       </div> 

    <!-------------------- ------ Right Box ---------------------------->
        
       <div class="col-md-6 right-box">
          <div class="row align-items-center">
            <form [formGroup]="loginForm"
                   (ngSubmit)="login()">
                <div class="header-text mb-4">
                     <h2>Hola de nuevo</h2>
                     <p>Bienvenid@ a tu Sistema de Ventas.</p>
                </div>
                <div class="input-group mb-3">
                    <input type="text" 
                           class="form-control form-control-lg bg-light fs-6" 
                           type="usuario"
                           formControlName="usuario"
                           placeholder="Nombre de Usuario">
                </div>
                <div class="input-group mb-3">
                    <input type="password" 
                           class="form-control form-control-lg bg-light fs-6" 
                           type="password"
                           formControlName="password"
                           placeholder="Contraseña">
                </div>
<!--                 <div class="input-group mb-5 d-flex justify-content-between">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="formCheck">
                        <label for="formCheck" class="form-check-label text-secondary" style="font-size: small;">Recordar Contraseña</label>
                    </div>
                </div> -->
                <div class="input-group mb-3">
                    <button class="btn btn-lg btn-primary w-100 fs-6"
                            type="submit"
                            [disabled]="loginForm.invalid">
                            Ingresar</button>
                </div>
            </form>
          </div>
       </div> 

      </div>
    </div>
