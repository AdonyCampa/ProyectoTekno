<!----------------------- Main Container -------------------------->

<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <!----------------------- Login Container -------------------------->

  <div class="row border rounded-5 p-3 bg-white shadow box-area">
    <!--------------------------- Left Box ----------------------------->

    <div
      class="col-md-6 rounded-4 d-flex justify-content-center align-items-center flex-column left-box bg-dark"
    >
      <div class="featured-image mb-3">
        <img src="/assets/images/robotic-hand.png" class="img-fluid" style="width: 250px" />
      </div>
      <p
        class="text-white fs-2"
        style="font-family: 'Courier New', Courier, monospace; font-weight: 600"
      >
        Iniciar Sesión
      </p>
      <small
        class="text-white text-wrap text-center"
        style="width: 17rem; font-family: 'Courier New', Courier, monospace"
        >Para poder iniciar sesión verificate</small
      >
    </div>

    <!-------------------- ------ Right Box ---------------------------->

    <div class="col-md-6 right-box">
      <div class="row align-items-center">
        <form [formGroup]="loginForm" (ngSubmit)="login()">
          <div class="header-text mb-4">
            <h2>Hola de nuevo</h2>
            <p>Bienvenid@ a tu Sistema de Ventas.</p>
          </div>
          <label for="usuario" class="form-label">Usuario</label>
          <div class="input-group mb-3">
            <input
              type="text"
              class="form-control form-control-lg bg-light fs-6"
              type="usuario"
              formControlName="usuario"
              placeholder="Ingresar Nombre de Usuario"
            />
          </div>

          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group mb-3">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              class="form-control form-control-lg bg-light fs-6"
              formControlName="password"
              placeholder="Ingresar Contraseña"
            />
            <!-- Ícono como botón -->
            <span class="input-group-text" style="cursor: pointer" (click)="togglePassword()">
              <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
            </span>
          </div>
          <div class="input-group mb-3">
            <button
              class="btn btn-lg btn-info w-100 fs-6"
              type="submit"
              [disabled]="loginForm.invalid"
            >
              Ingresar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
